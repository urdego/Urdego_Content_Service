name: Spring Boot & Gradle CI Jobs (With dev branches pull_request)

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'

jobs:
  build:
    # 실행 환경
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'

      # 디버깅용 디렉토리 구조 출력
      - name: 디버깅용 디렉토리 구조 출력
        run: |
          pwd
          ls -al

      # resources 폴더 생성
      - name: resources 폴더 생성
        run: |
          mkdir -p ./src/main/resources

      # yml 파일 생성
      - name: yml 파일 생성
        run: |
          echo "${{ secrets.CONTENT_APPLICATION_DEFAULT }}" > ./src/main/resources/application.yml
          echo "${{ secrets.CONTENT_APPLICATION_DB }}" > ./src/main/resources/database-prod.yml

      # gradlew 실행 권한 부여
      - name: Gradlew 실행권한 부여
        run: chmod +x ./gradlew

      # 빌드
      - name: 빌드
        run: ./gradlew clean build -x test

  test:
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v3

      # 디버깅용 디렉토리 구조 출력
      - name: 디버깅용 디렉토리 구조 출력
        run: |
          pwd
          ls -al

      # Gradle 테스트 실행
      - name: Gradle 테스트
        run: ./gradlew test
